name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --locked pytest

      - name: Run type check
        run: uv run --locked basedpyright

      - name: Run lint
        run: uv run --locked ruff check packages examples docs

      - name: Check formatting
        run: uv run --locked ruff format --check packages examples docs

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scopecat-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --project ../..

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/scopecat-ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Check generated daemon API types
        run: npm run check:api

      - name: Run UI tests
        run: npm test

      - name: Run UI type check
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end test
        run: npm run test:e2e
