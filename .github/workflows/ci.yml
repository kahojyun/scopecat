name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    name: ci-required
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests
          else
            echo "No executable test suite is currently present."
          fi
