name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --locked pytest

  python-tests-windows:
    name: Python tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --locked pytest

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Run type check
        run: uv run --locked basedpyright

      - name: Check architecture
        run: uv run --locked lint-imports

      - name: Run lint
        run: uv run --locked ruff check packages examples docs scripts

      - name: Check formatting
        run: uv run --locked ruff format --check packages examples docs scripts

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/scopecat-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --project ../..

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/scopecat-ui/package.json
          cache: true
          cache_dependency_path: apps/scopecat-ui/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated daemon API types
        run: pnpm run check:api

      - name: Check UI formatting
        run: pnpm run format:check

      - name: Run UI lint
        run: pnpm run lint

      - name: Run UI tests
        run: pnpm run test

      - name: Run UI type check
        run: pnpm run typecheck

      - name: Build UI
        run: pnpm exec vite build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser end-to-end test
        run: pnpm exec playwright test

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            apps/scopecat-ui/playwright-report
            apps/scopecat-ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - python-tests
      - python-tests-windows
      - python-quality
      - ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful jobs
        env:
          PYTHON_TESTS_RESULT: ${{ needs['python-tests'].result }}
          PYTHON_TESTS_WINDOWS_RESULT: ${{ needs['python-tests-windows'].result }}
          PYTHON_QUALITY_RESULT: ${{ needs['python-quality'].result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          test "$PYTHON_TESTS_RESULT" = success
          test "$PYTHON_TESTS_WINDOWS_RESULT" = success
          test "$PYTHON_QUALITY_RESULT" = success
          test "$UI_RESULT" = success
