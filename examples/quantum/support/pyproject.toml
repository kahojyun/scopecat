[project]
name = "quantum-lab-demo"
version = "0.1.0"
description = "Local lab example templates, reusable analysis steps, and virtual lab providers for Scopecat."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2",
  "scopecat",
  "scopecat-quantum",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
pythonpath = ["../../../packages/scopecat"]
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../../pyproject.toml"
src = ["src", "tests"]
exclude = [
  ".scopecat-examples",
]

[tool.uv.sources]
scopecat = { workspace = true }
scopecat-quantum = { workspace = true }
