[project]
name = "quantum-lab-demo"
version = "0.1.0"
description = "Local lab example templates, reusable analysis steps, and virtual lab providers for Scopecat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.10",
  "numpy>=2",
  "scopecat",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src", "tests"]
exclude = [
  "**/__pycache__",
  ".scopecat-examples",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"

[tool.pytest]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../../pyproject.toml"
src = ["src", "tests"]
exclude = [
  ".scopecat-examples",
]

[tool.uv.sources]
scopecat = { workspace = true }
