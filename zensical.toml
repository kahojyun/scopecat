[project]
site_name = "Scopecat"
site_description = "User and contributor documentation for Scopecat."
site_author = "Scopecat contributors"
site_url = "https://kahojyun.github.io/scopecat/"
repo_url = "https://github.com/kahojyun/scopecat"
repo_name = "kahojyun/scopecat"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Scopecat contributors"

nav = [
  { "Home" = "index.md" },
  { "User task guides" = [
    { "Experiment authoring dataflow" = "experiment-authoring.md" },
    { "Instrument control and authoring" = "instrument-control.md" },
    { "Measurement data workflows" = "measurement-data.md" },
    { "Analysis publication" = "analysis-publication.md" },
  ] },
  { "Developer architecture" = [
    { "Project charter" = "project-charter.md" },
    { "Experiment execution semantics" = "experiment-execution-model.md" },
    { "Lab daemon" = "lab-daemon.md" },
    { "Scalability benchmarks" = "scalability-benchmarks.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.plugins.mkdocstrings.handlers.python]
paths = [
  "packages/scopecat/src",
  "packages/scopecat-instruments/src",
  "packages/scopecat-quantum/src",
  "packages/scopecat-server/src",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
show_root_heading = true
show_source = false
