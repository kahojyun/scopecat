[project]
name = "scopecat-server"
version = "0.1.0"
description = "Local HTTP and SSE transport for a Scopecat project daemon."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "filelock>=3.18,<4",
  "httpx2>=2,<3",
  "psutil>=7,<8",
  "rich>=14,<15",
  "scopecat",
  "typer>=0.20,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
scopecat = "scopecat_server.cli:main"

[dependency-groups]
test = [
  "pytest>=9",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
pythonpath = ["../scopecat"]
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.uv.sources]
scopecat = { workspace = true }
