[project]
name = "scopecat"
version = "0.1.0"
description = "Brownfield-friendly experiment measurement platform."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src", "tests"]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
strict = ["src"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]
