[project]
name = "scopecat"
version = "0.1.0"
description = "Brownfield-friendly experiment measurement platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]
