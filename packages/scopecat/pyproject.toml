[project]
name = "scopecat"
version = "0.1.0"
description = "Brownfield-friendly experiment measurement platform."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "httpx2>=2,<3",
  "numpy>=2",
  "pyarrow>=15",
  "pydantic>=2,<3",
  "xarray>=2024.1",
]

[project.optional-dependencies]
pandas = [
  "pandas>=2",
]
polars = [
  "polars>=1",
]

[dependency-groups]
test = [
  "pytest>=9",
  "scopecat-testkit",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.uv.sources]
scopecat-testkit = { workspace = true }
