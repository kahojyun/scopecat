[project]
name = "scopecat-quantum"
version = "0.1.0"
description = "Hardware-independent quantum domain building blocks for Scopecat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "scopecat",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.uv.sources]
scopecat = { workspace = true }
