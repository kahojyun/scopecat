[project]
name = "scopecat-instruments"
version = "0.1.0"
description = "Real and virtual laboratory instrument drivers for Scopecat."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2",
  "pydantic>=2,<3",
  "scopecat",
]

[dependency-groups]
test = [
  "pytest>=9",
  "scopecat-testkit",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.uv.sources]
scopecat = { workspace = true }
scopecat-testkit = { workspace = true }
