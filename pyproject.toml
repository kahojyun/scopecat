[project]
name = "scopecat-workspace"
version = "0.1.0"
description = "Workspace for Scopecat packages, examples, and fixtures."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "quantum-lab-demo",
  "scopecat",
  "scopecat-quantum",
  "scopecat-server",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.6",
  "coverage[toml]>=7.10",
  "hypothesis>=6.155.7",
  "import-linter>=2.13",
  "pytest>=9",
  "ruff>=0.15.14",
]
notebook = [
  "ipykernel>=6.29",
]

[tool.basedpyright]
include = [
  "packages/scopecat/src",
  "packages/scopecat/tests",
  "packages/scopecat-server/src",
  "packages/scopecat-server/tests",
  "packages/scopecat-quantum/src",
  "packages/scopecat-quantum/tests",
  "examples/quantum/support/src",
  "examples/quantum/support/tests",
  "examples/quantum",
  "scripts",
]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "recommended"
extraPaths = [
  "packages/scopecat",
  "packages/scopecat/src",
  "packages/scopecat-server/src",
  "packages/scopecat-quantum",
  "packages/scopecat-quantum/src",
  "examples/quantum/support",
  "examples/quantum/support/src",
  "examples/quantum",
]
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportPrivateUsage = "error"
reportUninitializedInstanceVariable = "error"
reportImplicitStringConcatenation = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportUnusedParameter = "hint"
reportUnreachable = "hint"

# Execution environments use first-match semantics, so nested and test-specific
# roots must precede their parent projects.
[[tool.basedpyright.executionEnvironments]]
root = "examples/quantum/support/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "examples/quantum/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-quantum/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-server/tests"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-server/src"
reportUnusedFunction = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat/tests"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"

[tool.coverage.run]
branch = true
source = [
  "quantum_lab_demo",
  "scopecat",
  "scopecat_quantum",
  "scopecat_server",
]

[tool.coverage.report]
skip_empty = true

[tool.importlinter]
root_packages = [
  "quantum_lab_demo",
  "scopecat",
  "scopecat_quantum",
]
exclude_type_checking_imports = true
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Scopecat core remains domain neutral and offline"
type = "forbidden"
source_modules = ["scopecat"]
forbidden_modules = [
  "labrad",
  "numpy",
  "pandas",
  "pyvisa",
  "quantum_lab_demo",
  "requests",
  "scipy",
  "scopecat_quantum",
  "serial",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Inward layers do not depend on application or storage"
type = "forbidden"
source_modules = [
  "scopecat.compiler",
  "scopecat.kernel",
  "scopecat.records",
]
forbidden_modules = [
  "scopecat.adapters",
  "scopecat.api.analysis",
  "scopecat.api.data",
  "scopecat.api.lab",
  "scopecat.api.run",
  "scopecat.config.registry",
  "scopecat.execution",
  "scopecat.runs",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Records do not depend on SDK contracts"
type = "forbidden"
source_modules = ["scopecat.records"]
forbidden_modules = ["scopecat.sdk"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Authoring does not depend on later compiler or planning layers"
type = "forbidden"
source_modules = ["scopecat.authoring"]
forbidden_modules = [
  "scopecat.compiler.frontend",
  "scopecat.compiler.linking",
  "scopecat.compiler.typed",
  "scopecat.planning",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application layers do not select concrete adapters"
type = "forbidden"
source_modules = [
  "scopecat.analysis",
  "scopecat.api",
  "scopecat.application",
  "scopecat.config",
  "scopecat.execution",
  "scopecat.measurements",
  "scopecat.planning",
  "scopecat.runs",
]
forbidden_modules = ["scopecat.adapters"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Planning does not depend on the project application bundle"
type = "forbidden"
source_modules = ["scopecat.planning"]
forbidden_modules = ["scopecat.application"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Notebook facades delegate persistence use cases"
type = "forbidden"
source_modules = [
  "scopecat.api.analysis",
  "scopecat.api.lab",
  "scopecat.api.run",
]
forbidden_modules = [
  "scopecat.adapters",
  "scopecat.runs.access",
  "scopecat.runs.repository",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Quantum lab demo uses the supported domain SDK"
type = "forbidden"
source_modules = ["quantum_lab_demo"]
forbidden_modules = [
  "scopecat.compiler",
  "scopecat.measurements.host_transforms",
  "scopecat.measurements.projection",
  "scopecat.measurements.transform_model",
  "scopecat.measurements.values",
  "scopecat.sdk.domain.invocation",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Scopecat package dependencies are acyclic"
type = "acyclic_siblings"
ancestors = ["scopecat"]
# Deeper sibling aggregation can report cycles when the concrete module graph is acyclic.
depth = 0

[tool.pytest]
minversion = "9.0"
pythonpath = ["packages/scopecat"]
strict_config = true
strict_markers = true
testpaths = [
  "examples/quantum/support/tests",
  "examples/quantum/tests",
  "packages/scopecat-quantum/tests",
  "packages/scopecat-server/tests",
  "packages/scopecat/tests",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = [
  "packages/scopecat/src",
  "packages/scopecat-server/src",
  "packages/scopecat-server/tests",
  "packages/scopecat/tests",
  "packages/scopecat-quantum/src",
  "packages/scopecat-quantum/tests",
  "examples/quantum/support/src",
  "examples/quantum/support/tests",
  "examples/quantum",
  "scripts",
]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "DTZ",
  "E",
  "F",
  "FA",
  "G",
  "I",
  "ISC",
  "LOG",
  "PERF102",
  "PERF402",
  "PIE",
  "PTH",
  "PT011",
  "PT017",
  "PYI",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "TC006",
  "TRY400",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"packages/scopecat/src/scopecat/graph/relations/point_domain.py" = [
  # PEP 695 has no explicit variance syntax; PointAxis[Never] needs covariance.
  "UP046",
]
"**/tests/**/*.py" = [
  "ARG001",
  "S101",
]
"examples/quantum/notebooks/*.py" = [
  "S101",
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.uv]
exclude-newer = "14d"
default-groups = ["dev"]
package = false

[tool.uv.sources]
scopecat = { workspace = true }
scopecat-quantum = { workspace = true }
scopecat-server = { workspace = true }
quantum-lab-demo = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "examples/quantum/support",
]
