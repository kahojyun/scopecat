[project]
name = "scopecat-workspace"
version = "0.1.0"
description = "Workspace for Scopecat packages, examples, and fixtures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "quantum-lab-demo",
  "scopecat",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.6",
  "hypothesis>=6.155.7",
  "pytest>=9",
  "ruff>=0.15.14",
]
notebook = [
  "ipykernel>=6.29",
]

[tool.basedpyright]
include = [
  "packages/scopecat/src",
  "packages/scopecat/tests",
  "examples/quantum/support/src",
  "examples/quantum/support/tests",
  "examples/quantum",
]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
strict = ["packages/scopecat/src"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = [
  "examples/quantum/support/tests",
  "examples/quantum/tests",
  "packages/scopecat/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
  "packages/scopecat/src",
  "packages/scopecat/tests",
  "examples/quantum/support/src",
  "examples/quantum/support/tests",
  "examples/quantum",
]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "FA",
  "I",
  "ISC",
  "PIE",
  "PTH",
  "PYI",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
  "ARG001",
]

[tool.uv]
exclude-newer = "14d"
default-groups = ["dev", "notebook"]
package = false

[tool.uv.sources]
scopecat = { workspace = true }
quantum-lab-demo = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "examples/quantum/support",
]
