[project]
name = "scopecat-workspace"
version = "0.1.0"
description = "Workspace for Scopecat packages, examples, and fixtures."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "quantum-lab-demo",
  "scopecat",
  "scopecat-instruments",
  "scopecat-quantum",
  "scopecat-server",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.6",
  "hypothesis>=6.155.7",
  "import-linter>=2.13",
  "pytest>=9",
  "ruff>=0.15.14",
]
notebook = [
  "ipykernel>=6.29",
]

[tool.basedpyright]
include = [
  "packages/scopecat/src",
  "packages/scopecat/tests",
  "packages/scopecat-server/src",
  "packages/scopecat-server/tests",
  "packages/scopecat-instruments/src",
  "packages/scopecat-instruments/tests",
  "packages/scopecat-quantum/src",
  "packages/scopecat-quantum/tests",
  "examples/instruments/src",
  "examples/instruments/notebooks",
  "examples/quantum/support/src",
  "examples/quantum/support/tests",
  "examples/quantum",
  "scripts",
]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "recommended"
extraPaths = [
  "packages/scopecat",
  "packages/scopecat/src",
  "packages/scopecat-server/src",
  "packages/scopecat-instruments",
  "packages/scopecat-instruments/src",
  "packages/scopecat-quantum",
  "packages/scopecat-quantum/src",
  "examples/instruments/src",
  "examples/quantum/support",
  "examples/quantum/support/src",
  "examples/quantum",
]
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportPrivateUsage = "error"
reportUninitializedInstanceVariable = "error"
reportImplicitStringConcatenation = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportUnusedParameter = "hint"
reportUnreachable = "hint"

# Execution environments use first-match semantics, so nested and test-specific
# roots must precede their parent projects.
[[tool.basedpyright.executionEnvironments]]
root = "examples/quantum/support/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "examples/quantum/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-quantum/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-server/tests"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-server/src"
reportUnusedFunction = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-instruments/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat/tests"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"

[tool.importlinter]
root_packages = [
  "scopecat",
  "scopecat_instruments",
  "scopecat_quantum",
  "scopecat_server",
]
exclude_type_checking_imports = true
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Scopecat core remains domain neutral and offline"
type = "forbidden"
source_modules = ["scopecat"]
forbidden_modules = [
  "labrad",
  "numpy",
  "pandas",
  "pyvisa",
  "quantum_lab_demo",
  "requests",
  "scipy",
  "scopecat_quantum",
  "scopecat_server",
  "serial",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Inward layers do not depend on application or storage"
type = "forbidden"
source_modules = [
  "scopecat.compiler",
  "scopecat.kernel",
  "scopecat.records",
]
forbidden_modules = [
  "scopecat.adapters",
  "scopecat.api",
  "scopecat.application",
  "scopecat.config.registry",
  "scopecat.execution",
  "scopecat.planning",
  "scopecat.runs",
  "scopecat_server",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Shared program model is independent from authoring and compilation"
type = "forbidden"
source_modules = ["scopecat.program"]
forbidden_modules = [
  "scopecat.authoring",
  "scopecat.compiler",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Compiler consumes the shared program model, not authoring"
type = "forbidden"
source_modules = ["scopecat.compiler"]
forbidden_modules = ["scopecat.authoring"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application layers do not select concrete adapters"
type = "forbidden"
source_modules = [
  "scopecat.analysis",
  "scopecat.api",
  "scopecat.application",
  "scopecat.config",
  "scopecat.execution",
  "scopecat.measurements",
  "scopecat.planning",
  "scopecat.runs",
]
forbidden_modules = ["scopecat.adapters"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Core and server package dependencies are acyclic"
type = "acyclic_siblings"
ancestors = [
  "scopecat",
  "scopecat_server",
]
# Check concrete top-level module dependencies without aggregating deeper siblings.
depth = 0

[tool.pytest]
minversion = "9.0"
pythonpath = [
  "packages/scopecat",
  "packages/scopecat-instruments/src",
]
strict_config = true
strict_markers = true
testpaths = [
  "examples/instruments/tests",
  "examples/quantum/tests/test_first_use.py",
  "packages/scopecat-instruments/tests",
  "packages/scopecat-quantum/tests",
  "packages/scopecat-server/tests",
  "packages/scopecat/tests",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = [
  "packages/scopecat/src",
  "packages/scopecat-server/src",
  "packages/scopecat-server/tests",
  "packages/scopecat-instruments/src",
  "packages/scopecat-instruments/tests",
  "packages/scopecat/tests",
  "packages/scopecat-quantum/src",
  "packages/scopecat-quantum/tests",
  "examples/instruments/src",
  "examples/instruments/notebooks",
  "examples/quantum/support/src",
  "examples/quantum/support/tests",
  "examples/quantum",
  "scripts",
]

[tool.ruff.lint]
ignore = [
  # Domain APIs intentionally use conventional names such as id, type, and input.
  "A001",
  "A002",
  "A004",
  # Assertions express test expectations and trusted internal invariants.
  "S101",
]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "DTZ",
  "E",
  "F",
  "FA",
  "G",
  "I",
  "ISC",
  "LOG",
  "PERF102",
  "PERF402",
  "PIE",
  "PTH",
  "PT011",
  "PT017",
  "PYI",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "TC006",
  "TRY400",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"packages/scopecat/src/scopecat/program/point_domain.py" = [
  # PEP 695 has no explicit variance syntax; PointAxis[Never] needs covariance.
  "UP046",
]
"**/tests/**/*.py" = [
  "ARG001",
  "S101",
]
"examples/quantum/notebooks/*.py" = [
  "S101",
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.uv]
exclude-newer = "14d"
default-groups = ["dev"]
package = false

[tool.uv.sources]
scopecat = { workspace = true }
scopecat-instruments = { workspace = true }
scopecat-quantum = { workspace = true }
scopecat-server = { workspace = true }
quantum-lab-demo = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "examples/quantum/support",
]
