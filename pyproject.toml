[project]
name = "scopecat"
version = "0.0.0"
description = "Early workspace for Scopecat scientific measurement workflow research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "ruff",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[tool.ruff]
force-exclude = true
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
]

[tool.uv]
exclude-newer = "14d"
