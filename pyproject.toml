[project]
name = "scopecat-workspace"
version = "0.1.0"
description = "Workspace for Scopecat packages, examples, and fixtures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "quantum-lab-demo",
  "scopecat",
  "scopecat-quantum",
  "scopecat-server",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.6",
  "hypothesis>=6.155.7",
  "pytest>=9",
  "ruff>=0.15.14",
]
notebook = [
  "ipykernel>=6.29",
]

[tool.basedpyright]
include = [
  "packages/scopecat/src",
  "packages/scopecat/tests",
  "packages/scopecat-server/src",
  "packages/scopecat-server/tests",
  "packages/scopecat-quantum/src",
  "packages/scopecat-quantum/tests",
  "examples/quantum/support/src",
  "examples/quantum/support/tests",
  "examples/quantum",
]
exclude = [
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "recommended"
extraPaths = [
  "packages/scopecat",
  "packages/scopecat/src",
  "packages/scopecat-server/src",
  "packages/scopecat-quantum",
  "packages/scopecat-quantum/src",
  "examples/quantum/support",
  "examples/quantum/support/src",
  "examples/quantum",
]
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportPrivateUsage = "error"
reportUninitializedInstanceVariable = "error"
reportImplicitStringConcatenation = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportUnusedParameter = "hint"
reportUnreachable = "hint"

# Execution environments use first-match semantics, so nested and test-specific
# roots must precede their parent projects.
[[tool.basedpyright.executionEnvironments]]
root = "examples/quantum/support/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "examples/quantum/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-quantum/tests"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-server/tests"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat-server/src"
reportUnusedFunction = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat/tests"
reportAny = "none"
reportExplicitAny = "none"
reportPrivateUsage = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/scopecat"
reportImportCycles = "none"

[tool.pytest]
minversion = "9.0"
strict_config = true
strict_markers = true
testpaths = [
  "examples/quantum/support/tests",
  "examples/quantum/tests",
  "packages/scopecat-quantum/tests",
  "packages/scopecat-server/tests",
  "packages/scopecat/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
  "packages/scopecat/src",
  "packages/scopecat-server/src",
  "packages/scopecat-server/tests",
  "packages/scopecat/tests",
  "packages/scopecat-quantum/src",
  "packages/scopecat-quantum/tests",
  "examples/quantum/support/src",
  "examples/quantum/support/tests",
  "examples/quantum",
]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "DTZ",
  "E",
  "F",
  "FA",
  "G",
  "I",
  "ISC",
  "LOG",
  "PERF102",
  "PERF402",
  "PIE",
  "PTH",
  "PT011",
  "PT017",
  "PYI",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "TC006",
  "TRY400",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
  "ARG001",
  "S101",
]
"examples/quantum/notebooks/*.py" = [
  "S101",
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.uv]
exclude-newer = "14d"
default-groups = ["dev", "notebook"]
package = false

[tool.uv.sources]
scopecat = { workspace = true }
scopecat-quantum = { workspace = true }
scopecat-server = { workspace = true }
quantum-lab-demo = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "examples/quantum/support",
]
